# Copy to azure-pipelines.yml
# Change `file` if the suite is not at the repository root.
#
# GitHub: uses: mshobeyri/testlight-action@v1  with: { file, report, ... }
# Azure:  task: Testlight@1                   inputs: { file, report, ... }

trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: Testlight@1
    inputs:
      file: suite.mmt
      report: junit
      reportFile: results/junit.xml

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: results/junit.xml
      failTaskOnFailedTests: true
