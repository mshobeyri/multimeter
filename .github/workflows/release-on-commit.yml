# Create vX.Y.Z when a release is requested, then the tag workflow publishes
# Testlight, the VS Code extension, and the GitHub Action.
#
# Triggers:
#   - commit subject: `Release version 1.40.0` (optional `pre-release`)
#   - CHANGELOG.md in the commit with a new top `## [1.40.0]` heading
#   - workflow_dispatch with a version input
name: Tag release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag (e.g. 1.40.0). Empty = detect from commit or CHANGELOG.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect release
        id: detect
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/detect-release.mjs

      - name: Sync versions and push tag
        if: steps.detect.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          node scripts/sync-versions.mjs --set "$VERSION"
          git add package.json .cursor-plugin/plugin.json \
            mmtcli/package.json mmtcli/package-lock.json \
            .github/actions/testlight/action.yml \
            .github/actions/testlight/README.md \
            website/src/sections/CICDReady.tsx || true
          if ! git diff --cached --quiet; then
            git commit -m "Sync versions to ${VERSION}"
          fi

          git tag "v${VERSION}"
          git push origin HEAD "v${VERSION}"
          echo "Tagged v${VERSION} from ${{ steps.detect.outputs.reason }}"
