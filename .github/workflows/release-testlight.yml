# Tag vX.Y.Z = stable. Tag vX.Y.Z-pre = pre.
# Build binaries → GitHub Release. That must succeed before Docker, npm, Homebrew, Action.

name: Release testlight

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      marketplace_version: ${{ steps.channel.outputs.marketplace_version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      npm_tag: ${{ steps.channel.outputs.npm_tag }}
      float_tag: ${{ steps.channel.outputs.float_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect channel and verify versions
        id: channel
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          . scripts/version-channel.sh
          emit_github_outputs "$VERSION"
          node scripts/sync-versions.mjs --check --expect "$VERSION"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            os: macos-15-intel # Intel macOS (macos-13 retired Dec 2025)
            pkg-target: node22-macos-x64
            ext: ''
          - platform: macos-arm64
            os: macos-14       # Apple Silicon runner
            pkg-target: node22-macos-arm64
            ext: ''
          - platform: linux-x64
            os: ubuntu-latest
            pkg-target: node22-linux-x64
            ext: ''
          - platform: linux-arm64
            os: ubuntu-latest  # cross-compile via pkg
            pkg-target: node22-linux-arm64
            ext: ''
          - platform: win-x64
            os: windows-latest
            pkg-target: node22-win-x64
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mmtcli

      - name: Build core
        run: cd core && npm run build

      - name: Bundle CLI for pkg
        run: cd mmtcli && npm run build:pkg-bundle

      - name: Build binary
        # bash so Windows runners don't parse `\` line continuations as PowerShell
        shell: bash
        run: |
          mkdir -p bin/${{ matrix.platform }}
          cd mmtcli
          npm exec --no -- pkg dist-cjs/pkg-bundle.cjs \
            --sea \
            --compress Brotli \
            -c package.json \
            --targets ${{ matrix.pkg-target }} \
            --output ../bin/${{ matrix.platform }}/testlight${{ matrix.ext }}

      - name: Create mmt alias (Unix)
        if: matrix.ext == ''
        run: |
          cd bin/${{ matrix.platform }}
          ln -sf testlight mmt

      - name: Create mmt alias (Windows)
        if: matrix.ext == '.exe'
        run: |
          cp packaging/windows/mmt.cmd bin/${{ matrix.platform }}/mmt.cmd
        shell: bash

      - name: Apply Multimeter icon (Windows)
        if: matrix.ext == '.exe'
        shell: bash
        run: |
          node scripts/generate-testlight-ico.mjs
          node scripts/apply-windows-icon.mjs bin/${{ matrix.platform }}/testlight.exe

      - name: Create archive (Unix)
        if: matrix.ext == ''
        run: |
          tar -C bin/${{ matrix.platform }} -czf testlight-${{ matrix.platform }}.tar.gz testlight mmt

      - name: Create archive (Windows)
        if: matrix.ext == '.exe'
        run: |
          cd bin/${{ matrix.platform }}
          7z a ../../testlight-${{ matrix.platform }}.zip testlight.exe mmt.cmd
        shell: cmd

      - name: Generate checksum
        shell: bash
        run: |
          if [[ "${{ matrix.ext }}" == ".exe" ]]; then
            FILE="testlight-${{ matrix.platform }}.zip"
          else
            FILE="testlight-${{ matrix.platform }}.tar.gz"
          fi
          OUT="checksum-${{ matrix.platform }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE" > "$OUT"
          else
            shasum -a 256 "$FILE" > "$OUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testlight-${{ matrix.platform }}
          path: |
            testlight-${{ matrix.platform }}.*
            checksum-${{ matrix.platform }}.txt

  release:
    runs-on: ubuntu-latest
    needs: [channel, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksum-*.txt' \) \
            -exec cp {} release-assets/ \;
          cat release-assets/checksum-*.txt > release-assets/checksums-sha256.txt
          rm -f release-assets/checksum-*.txt

      - name: Release notes
        id: notes
        shell: bash
        run: |
          VERSION='${{ needs.channel.outputs.version }}'
          CHANNEL='${{ needs.channel.outputs.npm_tag }}'
          {
            echo 'body<<EOF'
            echo "## testlight v${VERSION}"
            echo
            if [ '${{ needs.channel.outputs.prerelease }}' = 'true' ]; then
              echo "Pre-release (\`${CHANNEL}\`). Default \`latest\` installs stay on the last stable."
              echo
              echo '```sh'
              echo "npm install -g mmt-testlight@${CHANNEL}"
              echo "npx -y mmt-mcp@${CHANNEL}"
              echo "docker pull mshobeyri/mmt-testlight:${CHANNEL}"
              echo "CHANNEL=${CHANNEL} curl -fsSL https://raw.githubusercontent.com/mshobeyri/multimeter/main/scripts/install-testlight.sh | bash"
              echo '```'
            else
              echo 'Stable release.'
              echo
              echo '```sh'
              echo 'npm install -g mmt-testlight'
              echo 'npx -y mmt-mcp'
              echo 'docker pull mshobeyri/mmt-testlight:latest'
              echo 'curl -fsSL https://raw.githubusercontent.com/mshobeyri/multimeter/main/scripts/install-testlight.sh | bash'
              echo '```'
            fi
            echo
            echo 'See [CHANGELOG.md](CHANGELOG.md).'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "testlight v${{ needs.channel.outputs.version }}"
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
          body: ${{ steps.notes.outputs.body }}
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Upload combined checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-sha256
          path: release-assets/checksums-sha256.txt

  docker:
    runs-on: ubuntu-latest
    needs: [channel, release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mmt-testlight:${{ needs.channel.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mmt-testlight:${{ needs.channel.outputs.float_tag }}

  npm:
    runs-on: ubuntu-latest
    needs: [channel, release]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and build
        run: |
          npm ci
          cd core && npm run build
          cd ../mmtcli && npm ci && npm run build
          cd ../mmtmcp && npm ci && npm run build

      - name: Publish mmt-testlight and mmt-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.channel.outputs.npm_tag }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is required"
            exit 1
          fi
          CLI_VERSION="$(node -p "require('./mmtcli/package.json').version")"
          MCP_VERSION="$(node -p "require('./mmtmcp/package.json').version")"
          if [ "$CLI_VERSION" != "$MCP_VERSION" ]; then
            echo "mmt-testlight ($CLI_VERSION) and mmt-mcp ($MCP_VERSION) must share a version"
            exit 1
          fi
          publish() {
            local dir="$1"
            local name="$2"
            local version
            version="$(node -p "require('./${dir}/package.json').version")"
            echo "Publishing ${name}@${version} (tag ${NPM_TAG})"
            if (cd "$dir" && npm publish --access public --tag "$NPM_TAG"); then
              echo "Published ${name}@${version}"
              return 0
            fi
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already on npm; skipping"
              return 0
            fi
            echo "Failed to publish ${name}@${version}"
            return 1
          }
          publish mmtcli mmt-testlight
          publish mmtmcp mmt-mcp
          echo "Confirming npm has both packages at ${CLI_VERSION} (tag ${NPM_TAG})"
          npm view "mmt-testlight@${CLI_VERSION}" version
          npm view "mmt-mcp@${MCP_VERSION}" version

  homebrew:
    runs-on: ubuntu-latest
    needs: [channel, release]
    if: needs.channel.outputs.prerelease != 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Download checksums
        uses: actions/download-artifact@v4
        with:
          name: checksums-sha256
          path: checksums
      - name: Publish Homebrew tap
        env:
          VERSION: ${{ needs.channel.outputs.version }}
          CHECKSUMS: checksums/checksums-sha256.txt
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TESTLIGHT_ACTION_TOKEN: ${{ secrets.TESTLIGHT_ACTION_TOKEN }}
        run: bash scripts/publish-homebrew.sh

  github-action:
    runs-on: ubuntu-latest
    needs: [channel, release]
    steps:
      - uses: actions/checkout@v4
      - name: Publish mshobeyri/testlight-action
        env:
          VERSION: ${{ needs.channel.outputs.version }}
          PRERELEASE: ${{ needs.channel.outputs.prerelease }}
          TESTLIGHT_ACTION_TOKEN: ${{ secrets.TESTLIGHT_ACTION_TOKEN }}
        run: bash scripts/publish-testlight-action.sh
