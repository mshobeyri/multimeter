# ──────────────────────────────────────────────────────────────────────
# CI workflow: Build testlight binaries and create a GitHub release
# ──────────────────────────────────────────────────────────────────────
# Triggered when a version tag (v*.*.*) is pushed.
# One version drives Testlight, the VS Code extension, and the GitHub Action.
#   v1.41.2       → stable (npm @latest, Docker :latest, Marketplace stable, Action @v1)
#   v1.41.2-pre   → pre-release (npm @pre, Docker :pre, Marketplace 1.41.2 --pre-release)
# ──────────────────────────────────────────────────────────────────────

name: Release testlight

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.channel.outputs.version }}
      marketplace_version: ${{ steps.channel.outputs.marketplace_version }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      npm_tag: ${{ steps.channel.outputs.npm_tag }}
      float_tag: ${{ steps.channel.outputs.float_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect channel and verify versions
        id: channel
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          . scripts/version-channel.sh
          emit_github_outputs "$VERSION"
          node scripts/sync-versions.mjs --check --expect "$VERSION"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-x64
            os: macos-15-intel # Intel macOS (macos-13 retired Dec 2025)
            pkg-target: node18-macos-x64
            ext: ''
          - platform: macos-arm64
            os: macos-14       # Apple Silicon runner
            pkg-target: node18-macos-arm64
            ext: ''
          - platform: linux-x64
            os: ubuntu-latest
            pkg-target: node18-linux-x64
            ext: ''
          - platform: linux-arm64
            os: ubuntu-latest  # cross-compile via pkg
            pkg-target: node18-linux-arm64
            ext: ''
          - platform: win-x64
            os: windows-latest
            pkg-target: node18-win-x64
            ext: '.exe'

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix mmtcli

      - name: Build core
        run: cd core && npm run build

      - name: Build CLI (CJS)
        run: cd mmtcli && npm run build:cjs

      - name: Build binary
        # bash so Windows runners don't parse `\` line continuations as PowerShell
        shell: bash
        run: |
          mkdir -p bin/${{ matrix.platform }}
          cd mmtcli
          npx pkg src/pkg-entry.cjs \
            --targets ${{ matrix.pkg-target }} \
            --output ../bin/${{ matrix.platform }}/testlight${{ matrix.ext }}

      - name: Create mmt alias (Unix)
        if: matrix.ext == ''
        run: |
          cd bin/${{ matrix.platform }}
          ln -sf testlight mmt

      - name: Create mmt alias (Windows)
        if: matrix.ext == '.exe'
        run: |
          cp packaging/windows/mmt.cmd bin/${{ matrix.platform }}/mmt.cmd
        shell: bash

      - name: Apply Multimeter icon (Windows)
        if: matrix.ext == '.exe'
        # Optional: resedit must not grow the pkg payload; skip rather than fail the release
        continue-on-error: true
        shell: bash
        run: |
          npm install --no-save --no-package-lock png-to-ico resedit pe-library
          node scripts/generate-testlight-ico.mjs
          node scripts/apply-windows-icon.mjs bin/${{ matrix.platform }}/testlight.exe

      - name: Create archive (Unix)
        if: matrix.ext == ''
        run: |
          tar -C bin/${{ matrix.platform }} -czf testlight-${{ matrix.platform }}.tar.gz testlight mmt

      - name: Create archive (Windows)
        if: matrix.ext == '.exe'
        run: |
          cd bin/${{ matrix.platform }}
          7z a ../../testlight-${{ matrix.platform }}.zip testlight.exe mmt.cmd
        shell: cmd

      - name: Generate checksum
        shell: bash
        run: |
          if [[ "${{ matrix.ext }}" == ".exe" ]]; then
            FILE="testlight-${{ matrix.platform }}.zip"
          else
            FILE="testlight-${{ matrix.platform }}.tar.gz"
          fi
          OUT="checksum-${{ matrix.platform }}.txt"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$FILE" > "$OUT"
          else
            # macOS runners provide shasum, not sha256sum
            shasum -a 256 "$FILE" > "$OUT"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: testlight-${{ matrix.platform }}
          path: |
            testlight-${{ matrix.platform }}.*
            checksum-${{ matrix.platform }}.txt

  # ── Docker build ──────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    needs: [channel, build]
    # Do not block the GitHub Release if Hub credentials are missing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mmt-testlight:${{ needs.channel.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mmt-testlight:${{ needs.channel.outputs.float_tag }}

  # ── npm publish ───────────────────────────────────────────────────
  npm:
    runs-on: ubuntu-latest
    needs: [channel, build]
    # Do not block the GitHub Release if NPM_TOKEN is missing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install & build
        run: |
          npm ci
          cd core && npm run build
          cd ../mmtcli && npm ci && npm run build
          cd ../mmtmcp && npm ci && npm run build

      - name: Publish mmt-testlight
        run: cd mmtcli && npm publish --access public --tag ${{ needs.channel.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @mmt/mcp
        run: cd mmtmcp && npm publish --access public --tag ${{ needs.channel.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── GitHub Release ────────────────────────────────────────────────
  release:
    runs-on: ubuntu-latest
    # Publish binaries even when npm/Docker secrets are missing.
    needs: [channel, build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'checksum-*.txt' \) \
            -exec cp {} release-assets/ \;
          # Combine checksums
          cat release-assets/checksum-*.txt > release-assets/checksums-sha256.txt
          rm -f release-assets/checksum-*.txt

      - name: Release notes
        id: notes
        shell: bash
        run: |
          VERSION='${{ needs.channel.outputs.version }}'
          CHANNEL='${{ needs.channel.outputs.npm_tag }}'
          {
            echo 'body<<EOF'
            echo "## testlight v${VERSION}"
            echo
            if [ '${{ needs.channel.outputs.prerelease }}' = 'true' ]; then
              echo "Pre-release (\`${CHANNEL}\`). Default \`latest\` installs stay on the last stable."
              echo
              echo '```sh'
              echo "npm install -g mmt-testlight@${CHANNEL}"
              echo "npx -y @mmt/mcp@${CHANNEL}"
              echo "docker pull mshobeyri/mmt-testlight:${CHANNEL}"
              echo "CHANNEL=${CHANNEL} curl -fsSL https://raw.githubusercontent.com/mshobeyri/multimeter/main/scripts/install-testlight.sh | bash"
              echo '```'
            else
              echo 'Stable release.'
              echo
              echo '```sh'
              echo 'npm install -g mmt-testlight'
              echo 'npx -y @mmt/mcp'
              echo 'docker pull mshobeyri/mmt-testlight:latest'
              echo 'curl -fsSL https://raw.githubusercontent.com/mshobeyri/multimeter/main/scripts/install-testlight.sh | bash'
              echo '```'
            fi
            echo
            echo 'See [CHANGELOG.md](CHANGELOG.md).'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "testlight v${{ needs.channel.outputs.version }}"
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
          body: ${{ steps.notes.outputs.body }}
          files: release-assets/*
          fail_on_unmatched_files: false

  github-action:
    runs-on: ubuntu-latest
    needs: [channel]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Publish mshobeyri/testlight-action
        env:
          VERSION: ${{ needs.channel.outputs.version }}
          PRERELEASE: ${{ needs.channel.outputs.prerelease }}
          TESTLIGHT_ACTION_TOKEN: ${{ secrets.TESTLIGHT_ACTION_TOKEN }}
        run: bash scripts/publish-testlight-action.sh

  vscode:
    runs-on: ubuntu-latest
    needs: [channel]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and compile
        run: |
          npm ci
          npm run compile
          npm run cursor:validate-plugin
      - name: Publish VS Code extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.channel.outputs.version }}
          MARKETPLACE_VERSION: ${{ needs.channel.outputs.marketplace_version }}
          PRERELEASE: ${{ needs.channel.outputs.prerelease }}
        run: |
          if [ -z "${VSCE_PAT}" ]; then
            echo "Skip Marketplace publish: set repo secret VSCE_PAT"
            exit 0
          fi
          if echo "$MARKETPLACE_VERSION" | grep -qE -- '-'; then
            echo "Refusing Marketplace publish: version '${MARKETPLACE_VERSION}' contains a hyphen. Use major.minor.patch only."
            exit 1
          fi
          if [ "$VERSION" != "$MARKETPLACE_VERSION" ]; then
            node scripts/sync-versions.mjs --set "$MARKETPLACE_VERSION"
          fi
          if [ "$PRERELEASE" = "true" ]; then
            echo "Marketplace: ${MARKETPLACE_VERSION} as pre-release (from ${VERSION})"
            npx @vscode/vsce publish --pre-release --readme-path EXTENSION.md --allow-package-all-secrets --allow-package-env-file
          else
            echo "Marketplace: ${MARKETPLACE_VERSION} as stable"
            npx @vscode/vsce publish --readme-path EXTENSION.md --allow-package-all-secrets --allow-package-env-file
          fi
