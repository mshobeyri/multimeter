name: Check versions

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check package.json versions
        run: node scripts/sync-versions.mjs --check
