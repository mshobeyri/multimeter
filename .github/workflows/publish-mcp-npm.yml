# Publish only @mmt/mcp (first scoped publish, or retry after org setup).
name: Publish MCP npm

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build from
        required: true
        default: v1.42.2-pre
      npm_tag:
        description: npm dist-tag
        required: true
        default: pre

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Build and publish @mmt/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd mmtmcp
          npm ci
          npm run build
          npm publish --access public --tag "${{ inputs.npm_tag }}"
