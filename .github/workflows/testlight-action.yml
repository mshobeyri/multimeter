# Prove the documented GitHub Action + README snippet against a real example suite.
name: Testlight action

on:
  push:
    branches: [main, dev]
    paths:
      - '.github/actions/testlight/**'
      - '.github/workflows/testlight-action.yml'
      - 'examples/basic/04_basic_suite/**'
  pull_request:
    paths:
      - '.github/actions/testlight/**'
      - '.github/workflows/testlight-action.yml'
      - 'examples/basic/04_basic_suite/**'
  workflow_dispatch:

jobs:
  readme-snippet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run example suite
        uses: ./.github/actions/testlight
        with:
          file: examples/basic/04_basic_suite/suite.mmt
          report: junit
          report-file: results/junit.xml
          # Use a published npm build. The Action default is the repo version,
          # which is not on npm until the release job finishes.
          version: latest

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testlight-junit
          path: results/junit.xml
