# Dogfood the Testlight Action product (mmtaction/) against its sample suite.
# This repo does not consume mshobeyri/testlight-action; customers do.
name: Testlight action

on:
  push:
    branches: [main, dev]
    paths:
      - 'mmtaction/**'
      - '.github/workflows/testlight-action.yml'
  pull_request:
    paths:
      - 'mmtaction/**'
      - '.github/workflows/testlight-action.yml'
  workflow_dispatch:

jobs:
  sample-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run sample suite
        uses: ./mmtaction
        with:
          file: mmtaction/examples/tests/suite.mmt
          report: junit
          report-file: results/junit.xml
          version: latest

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testlight-junit
          path: results/junit.xml
