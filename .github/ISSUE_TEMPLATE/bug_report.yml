name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Run …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Multimeter version
      placeholder: e.g. 1.34.0
    validations:
      required: true
  - type: input
    id: vscode
    attributes:
      label: VS Code / Cursor version
  - type: textarea
    id: file
    attributes:
      label: Sample .mmt (optional)
      render: yaml
