# Copied to mshobeyri/testlight-action as .github/workflows/samples.yml
name: Samples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          file: examples/echo_test.mmt
          version: latest

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          file: examples/get_json.mmt
          version: latest

  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        with:
          file: examples/suite.mmt
          report: junit
          report-file: results/junit.xml
          version: latest
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: testlight-junit
          path: results/junit.xml
