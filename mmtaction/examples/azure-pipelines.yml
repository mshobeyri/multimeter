# Copy to azure-pipelines.yml in a repo that contains the .mmt files.
# Change `file` if the suite is not at examples/suite.mmt.
#
# GitHub `with:` == Azure `inputs:`. The task does not check out git.
# `checkout: self` is a pipeline step (Azure already does it by default).

trigger:
  - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: Testlight@1
    inputs:
      file: examples/suite.mmt
      report: junit
      reportFile: results/junit.xml

  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: results/junit.xml
      failTaskOnFailedTests: true
    displayName: Publish JUnit

  # Tests in another repo (GitHub: a second checkout):
  # - checkout: git://MyOrg/api-tests@refs/heads/main
  #   path: tests
  # then: file: tests/suite.mmt
