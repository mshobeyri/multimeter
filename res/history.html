<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://microsoft.github.io/vscode-codicons/dist/codicon.css">
</head>

<body>
    <div id="history-list"></div>
    <style>
        :root {
            --history-row-size: 12px;
            --history-meta-size: 11px;
            --history-detail-size: 11px;
            --history-section-size: 10px;
            --history-muted: var(--vscode-descriptionForeground, #888);
            --history-radius: 6px;
        }

        body {
            margin: 0;
            padding: 4px 0;
            font-family: var(--vscode-font-family, sans-serif);
            color: var(--vscode-foreground, #ccc);
        }

        .history-list {
            color: var(--vscode-foreground, #ccc);
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-row {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: var(--history-radius);
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: var(--history-row-size);
            margin-bottom: 1px;
            position: relative;
        }

        .history-row:hover {
            background: var(--vscode-list-hoverBackground, #2a2d2e);
        }

        .history-icon {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            opacity: 0.85;
            vertical-align: middle;
        }

        .mock-protocol-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
            margin-right: 8px;
        }

        .mock-protocol-wrapper .history-icon {
            margin-right: 0;
            position: absolute;
            bottom: -3px;
            right: -5px;
            width: 10px;
            height: 10px;
        }

        .mock-server-icon {
            font-size: 14px !important;
        }

        .history-title {
            flex: 1;
            color: var(--vscode-foreground, #ccc);
            font-size: var(--history-row-size);
            margin-left: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            font-size: var(--history-meta-size);
            color: var(--history-muted);
            margin-left: 12px;
            min-width: 90px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .drawer-content {
            border-radius: 0 0 var(--history-radius) var(--history-radius);
            margin: 0 4px 6px 20px;
            padding: 10px 12px 12px;
            font-size: var(--history-detail-size);
            color: var(--vscode-foreground, #ccc);
            white-space: pre-wrap;
            animation: drawerOpen 0.18s ease-out;
        }

        .drawer-section {
            margin-bottom: 12px;
        }

        .drawer-section:last-child {
            margin-bottom: 0;
        }

        .drawer-section-title {
            display: block;
            font-size: var(--history-section-size);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--history-muted);
            margin-bottom: 4px;
        }

        .drawer-sub {
            padding-left: 12px;
        }

        .drawer-value {
            color: var(--vscode-foreground, #ccc);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            word-break: break-all;
            line-height: 1.45;
        }

        .drawer-table {
            border-collapse: collapse;
            width: 100%;
        }

        .drawer-table th,
        .drawer-table td {
            border: none;
            padding: 2px 0;
            font-size: var(--history-detail-size);
            text-align: left;
            vertical-align: top;
            line-height: 1.45;
        }

        .drawer-table tr + tr th,
        .drawer-table tr + tr td {
            padding-top: 3px;
        }

        .drawer-table th {
            color: var(--vscode-foreground, #ccc);
            font-weight: 600;
            width: 110px;
            padding-right: 12px;
            white-space: nowrap;
        }

        .drawer-table td {
            color: var(--vscode-foreground, #ccc);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            word-break: break-all;
        }

        .drawer-content pre {
            color: var(--vscode-foreground, #ccc);
            background: rgba(127, 127, 127, 0.14);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: var(--history-detail-size);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            margin: 0;
            overflow-x: auto;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        @keyframes drawerOpen {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .drawer-arrow {
            margin-right: 6px;
            font-size: 13px;
            color: var(--vscode-foreground, #aaa);
            transition: transform 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .drawer-arrow.open {
            transform: rotate(90deg);
            color: #3399ff;
        }

        /* Enable horizontal scrolling when panel is narrow */
        @media (max-width: 400px) {
            body {
                overflow-x: auto;
                min-width: 400px;
            }
        }
    </style>
    <script>
        const vscode = acquireVsCodeApi();
        const history = __HISTORY_DATA__;
        let openIdx = null;

        function getTypeIcon(type, status, protocol) {
            // Mock server entries show send/recv arrows just like regular entries
            return type === 'send'
                ? '<span class="codicon codicon-arrow-up" style="color:#3399ff"></span>'
                : type === 'recv' && status < 400
                    ? '<span class="codicon codicon-arrow-down" style="color:#66bb6a"></span>'
                    : '<span class="codicon codicon-chrome-close" style="color:#ff5555"></span>';
        }
        function getProtocolIcon(protocol, serverType) {
            if (protocol === 'mock') {
                // For mock entries, show the underlying protocol icon with a small server badge
                var iconSrc = '__HTTP_ICON__';
                if (serverType === 'ws') { iconSrc = '__WS_ICON__'; }
                return '<span class="mock-protocol-wrapper">' +
                    '<span class="codicon codicon-server mock-server-icon" style="color:#66bb6a"></span>' +
                    '<img src="' + iconSrc + '" class="history-icon" />' +
                    '</span>';
            }
            if (protocol === 'ws') return '<img src="__WS_ICON__" class="history-icon" />';
            if (protocol === 'grpc') return '<img src="__GRPC_ICON__" class="history-icon" />';
            return '<img src="__HTTP_ICON__" class="history-icon" />';
        }

        function renderVerticalTable(obj) {
            if (!obj || Object.keys(obj).length === 0) return '';
            return '<table class="drawer-table">' +
                Object.entries(obj).map(function ([key, val]) {
                    return '<tr><th>' + key + '</th><td>' + val + '</td></tr>';
                }).join('') +
                '</table>';
        }

        function renderHistory() {
            const list = document.getElementById('history-list');

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function renderCodicons(text) {
                // Supports VS Code codicon string syntax: $(icon-name)
                // Example: $(server) $(arrow-up)
                return escapeHtml(String(text || '')).replace(/\$\(([a-z0-9-]+)\)/gi, function (_m, icon) {
                    return '<span class="codicon codicon-' + icon + '" style="margin-right:4px"></span>';
                });
            }

            list.innerHTML =
                '<ul class="history-list">' +
                history.map(function (item, idx) {
                    const isError = item.type === 'error';
                    return '<li>' +
                        '<div class="history-row" onclick="toggleDrawer(' + idx + ')">' +
                        '<span class="drawer-arrow' + (openIdx === idx ? ' open' : '') + '">&#9654;</span>' +
                        getTypeIcon(item.type, item.status, item.protocol) +
                        getProtocolIcon(item.protocol, item.serverType) +
                        '<span class="history-title"' + (isError || item.status >= 400 ? ' style="color:#ff5555;"' : '') + '>' + escapeHtml(item.title) + '</span>' +
                        '<span class="history-time">' +
                        (item.duration >= 0
                            ? '<span style="color:' + (isError || item.status >= 400 ? '#ff5555' : '#66bb6a') + ';">(' + item.duration + 'ms)</span> '
                            : '') +
                        (item.status !== undefined
                            ? (
                                isError || item.status >= 400
                                    ? '<span style="color:#ff5555;font-weight: bold;">[' + item.status + ']</span> '
                                    : '<span style="color:#66bb6a;font-weight: bold;">[' + item.status + ']</span> '
                            )
                            : ''
                        ) +
                        item.time +
                        '</span>' +
                        '</div>' +
                        (openIdx === idx
                            ? '<div class="drawer-content">' +
                            '<div class="drawer-section"><span class="drawer-section-title">Method</span><div class="drawer-sub"><span class="drawer-value">' + item.method + '</span></div></div>' +
                            '<div class="drawer-section"><span class="drawer-section-title">Protocol</span><div class="drawer-sub"><span class="drawer-value">' + item.protocol + '</span></div></div>' +
                            (item.status !== undefined
                                ? (
                                    isError || item.status >= 400
                                        ? '<div class="drawer-section"><span class="drawer-section-title">Status</span><div class="drawer-sub"><span class="drawer-value" style="color:#ff5555;">' + item.status + '</span></div></div>'
                                        : '<div class="drawer-section"><span class="drawer-section-title">Status</span><div class="drawer-sub"><span class="drawer-value" style="color:#66bb6a;">' + item.status + '</span></div></div>'
                                )
                                : ''
                            ) +
                            (item.cookies && Object.keys(item.cookies).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Cookies</span><div class="drawer-sub">' + renderVerticalTable(item.cookies) + '</div></div>' : '') +
                            (item.headers && Object.keys(item.headers).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Headers</span><div class="drawer-sub">' + renderVerticalTable(item.headers) + '</div></div>' : '') +
                            (item.query && Object.keys(item.query).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Query</span><div class="drawer-sub">' + renderVerticalTable(item.query) + '</div></div>' : '') +
                            (item.content
                                ? '<div class="drawer-section"><span class="drawer-section-title">Body</span><div class="drawer-sub"><pre>' + escapeHtml(item.content) + '</pre></div></div>' : '') +
                            '</div>'
                            : '') +
                        '</li>';
                }).join('') +
                '</ul>';
        }

        window.toggleDrawer = function (idx) {
            openIdx = openIdx === idx ? null : idx;
            renderHistory();
        };

        window.addEventListener('message', function (event) {
            const msg = event.data;
            if (msg.command === 'refreshHistory') {
                vscode.postMessage({ type: 'refreshHistory' });
            }
        });

        window.addEventListener('message', function (event) {
            const msg = event.data;
            if (msg.command === 'setHistory') {
                window.history = msg.history;
                renderHistory();
            }
        });

        renderHistory();
    </script>
</body>

</html>
