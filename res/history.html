<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://microsoft.github.io/vscode-codicons/dist/codicon.css">
</head>

<body>
    <div id="history-list"></div>
    <style>
        :root {
            --history-row-size: 12px;
            --history-meta-size: 11px;
            --history-detail-size: 11px;
            --history-section-size: 10px;
            --history-muted: var(--vscode-descriptionForeground, #888);
            --history-radius: 6px;
        }

        body {
            margin: 0;
            padding: 4px 0;
            font-family: var(--vscode-font-family, sans-serif);
            color: var(--vscode-foreground, #ccc);
        }

        .history-list {
            color: var(--vscode-foreground, #ccc);
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-row {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: var(--history-radius);
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: var(--history-row-size);
            margin-bottom: 1px;
            position: relative;
        }

        .history-row:hover {
            background: var(--vscode-list-hoverBackground, #2a2d2e);
        }

        .history-badge {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            min-width: 34px;
            max-width: 34px;
            height: 14px;
            padding: 0 2px;
            margin-right: 6px;
            border-radius: 2px;
            color: #fff;
            font-size: 8px;
            font-weight: 600;
            line-height: 14px;
            letter-spacing: 0;
            text-transform: uppercase;
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
        }

        .history-badge-mock {
            outline: 1px solid rgba(255, 255, 255, 0.35);
            outline-offset: 0;
        }

        .history-type-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .history-type-icon .codicon {
            font-size: 14px;
            line-height: 1;
        }

        .history-type-icon-bg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.28;
            pointer-events: none;
        }

        .history-type-icon-bg .codicon {
            font-size: 16px;
        }

        .history-type-icon-fg {
            position: relative;
            z-index: 1;
        }

        .history-title {
            flex: 1;
            color: var(--vscode-foreground, #ccc);
            font-size: var(--history-row-size);
            margin-left: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            font-size: var(--history-meta-size);
            color: var(--history-muted);
            margin-left: 12px;
            min-width: 90px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .drawer-content {
            border-radius: 0 0 var(--history-radius) var(--history-radius);
            margin: 0 4px 6px 20px;
            padding: 10px 12px 12px;
            font-size: var(--history-detail-size);
            color: var(--vscode-foreground, #ccc);
            white-space: pre-wrap;
            animation: drawerOpen 0.18s ease-out;
        }

        .drawer-section {
            margin-bottom: 12px;
        }

        .drawer-section:last-child {
            margin-bottom: 0;
        }

        .drawer-section-title {
            display: block;
            font-size: var(--history-section-size);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--history-muted);
            margin-bottom: 4px;
        }

        .drawer-section-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .drawer-section-header .drawer-section-title {
            margin-bottom: 0;
        }

        .drawer-format-btn {
            padding: 1px 5px;
            font-size: 10px;
            line-height: 1.3;
            border: 1px solid var(--vscode-editorWidget-border, #555);
            border-radius: 3px;
            background: transparent;
            color: var(--vscode-foreground, #ccc);
            cursor: pointer;
        }

        .drawer-format-btn:hover {
            background: var(--vscode-toolbar-hoverBackground, rgba(255, 255, 255, 0.08));
        }

        .drawer-sub {
            padding-left: 12px;
        }

        .drawer-value {
            color: var(--vscode-foreground, #ccc);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            word-break: break-all;
            line-height: 1.45;
        }

        .drawer-table {
            border-collapse: collapse;
            width: 100%;
        }

        .drawer-table th,
        .drawer-table td {
            border: none;
            padding: 2px 0;
            font-size: var(--history-detail-size);
            text-align: left;
            vertical-align: top;
            line-height: 1.45;
        }

        .drawer-table tr + tr th,
        .drawer-table tr + tr td {
            padding-top: 3px;
        }

        .drawer-table th {
            color: var(--vscode-foreground, #ccc);
            font-weight: 600;
            width: 110px;
            padding-right: 12px;
            white-space: nowrap;
        }

        .drawer-table td {
            color: var(--vscode-foreground, #ccc);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            word-break: break-all;
        }

        .drawer-content pre {
            color: var(--vscode-foreground, #ccc);
            background: rgba(127, 127, 127, 0.14);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: var(--history-detail-size);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            margin: 0;
            overflow-x: auto;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
        }

        @keyframes drawerOpen {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .drawer-arrow {
            margin-right: 6px;
            font-size: 13px;
            color: var(--vscode-foreground, #aaa);
            transition: transform 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .drawer-arrow.open {
            transform: rotate(90deg);
            color: #3399ff;
        }

        /* Enable horizontal scrolling when panel is narrow */
        @media (max-width: 400px) {
            body {
                overflow-x: auto;
                min-width: 400px;
            }
        }
    </style>
    <script>
        const vscode = acquireVsCodeApi();
        const history = __HISTORY_DATA__;
        let openIdx = null;
        /** Per-item body format toggle: idx -> true when showing beautified body. */
        var formattedBodyByIdx = {};

        function indentXml(xml) {
            var padded = xml.replace(/(>)(<)(\/*)/g, '$1\n$2$3');
            var lines = padded.split('\n');
            var indent = 0;
            var out = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) {
                    continue;
                }
                if (/^<\/\w/.test(line)) {
                    indent = Math.max(indent - 1, 0);
                }
                out.push(new Array(indent + 1).join('  ') + line);
                if (/^<\w[^>]*[^\/]>.*$/.test(line) && !/^<.*>.*<\/\w/.test(line)) {
                    indent += 1;
                }
            }
            return out.join('\n');
        }

        function tryFormatBody(content) {
            if (content == null) {
                return '';
            }
            var text = String(content);
            var trimmed = text.trimStart();
            try {
                if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
                    return JSON.stringify(JSON.parse(text), null, 2);
                }
            } catch (e) { /* not JSON */ }
            if (trimmed.charAt(0) === '<') {
                try {
                    return indentXml(text);
                } catch (e) { /* leave raw */ }
            }
            return text;
        }

        function canFormatBody(content) {
            if (content == null || content === '') {
                return false;
            }
            var text = String(content);
            var trimmed = text.trimStart();
            try {
                if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
                    JSON.parse(text);
                    return true;
                }
            } catch (e) { /* not JSON */ }
            return trimmed.charAt(0) === '<';
        }

        function getTypeIcon(type, status, protocol) {
            var isMock = String(protocol || '').toLowerCase() === 'mock';
            var color;
            var fg;
            if (type === 'send') {
                color = '#3399ff';
                fg = '<span class="codicon codicon-arrow-up history-type-icon-fg" style="color:' + color + '"></span>';
            } else if (type === 'recv' && !(status >= 400)) {
                color = '#66bb6a';
                fg = '<span class="codicon codicon-arrow-down history-type-icon-fg" style="color:' + color + '"></span>';
            } else {
                color = '#ff5555';
                fg = '<span class="codicon codicon-arrow-down history-type-icon-fg" style="color:' + color + '"></span>';
            }
            var bg = isMock
                ? '<span class="history-type-icon-bg" title="Mock server" style="color:' + color + '"><span class="codicon codicon-vm-compact"></span></span>'
                : '';
            return '<span class="history-type-icon">' + bg + fg + '</span>';
        }

        // Same colors/labels as the API tester method/protocol selector.
        var METHOD_PROTOCOL_COLORS = {
            get: '#61affe',
            post: '#49cc90',
            put: '#fca130',
            delete: '#f93e3e',
            patch: '#50e3c2',
            head: '#9012fe',
            options: '#0d5aa7',
            trace: '#888',
            ws: '#9b59b6',
            graphql: '#e535ab',
            grpc: '#244c5a',
            http: '#61affe'
        };
        var PROTOCOL_LABELS = {
            ws: 'WS',
            graphql: 'GraphQL',
            grpc: 'gRPC'
        };

        function getMethodOrProtocolBadge(item) {
            var protocol = String(item.protocol || 'http').toLowerCase();
            var method = String(item.method || 'get').toLowerCase();
            var serverType = String(item.serverType || '').toLowerCase();
            var isMock = protocol === 'mock';
            var label;
            var colorKey;

            if (isMock) {
                if (serverType === 'ws' || method === 'ws') {
                    label = PROTOCOL_LABELS.ws;
                    colorKey = 'ws';
                } else if (serverType === 'graphql' || method === 'graphql') {
                    label = PROTOCOL_LABELS.graphql;
                    colorKey = 'graphql';
                } else if (serverType === 'grpc' || method === 'grpc') {
                    label = PROTOCOL_LABELS.grpc;
                    colorKey = 'grpc';
                } else {
                    label = method.toUpperCase();
                    colorKey = METHOD_PROTOCOL_COLORS[method] ? method : 'get';
                }
            } else if (protocol === 'ws' || protocol === 'graphql' || protocol === 'grpc') {
                label = PROTOCOL_LABELS[protocol] || protocol.toUpperCase();
                colorKey = protocol;
            } else {
                label = method.toUpperCase();
                colorKey = METHOD_PROTOCOL_COLORS[method] ? method : 'get';
            }

            var color = METHOD_PROTOCOL_COLORS[colorKey] || '#888';
            var mockClass = isMock ? ' history-badge-mock' : '';
            var display = String(label).toUpperCase();
            var len = display.length;
            var fontSize = len <= 4 ? '8px' : len <= 5 ? '7px' : len <= 6 ? '6.5px' : '5.5px';
            return '<span class="history-badge' + mockClass + '" style="background:' + color +
                ';font-size:' + fontSize + '" title="' +
                (isMock ? 'mock ' : '') + display + '">' + display + '</span>';
        }

        function displayTitle(item) {
            var title = String(item.title || '');
            var urlMatch = title.match(/((?:https?|wss?):\/\/\S+)/i);
            if (urlMatch) {
                return urlMatch[1];
            }
            return title.replace(
                /^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS|TRACE|send|recv|connnect|connect|connected|closed|error|close|gRPC)\s+/i,
                ''
            ).replace(/\s+Error$/i, '');
        }

        function renderVerticalTable(obj) {
            if (!obj || Object.keys(obj).length === 0) return '';
            return '<table class="drawer-table">' +
                Object.entries(obj).map(function ([key, val]) {
                    return '<tr><th>' + key + '</th><td>' + val + '</td></tr>';
                }).join('') +
                '</table>';
        }

        function renderHistory() {
            const list = document.getElementById('history-list');

            function escapeHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/\"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function renderCodicons(text) {
                // Supports VS Code codicon string syntax: $(icon-name)
                // Example: $(server) $(arrow-up)
                return escapeHtml(String(text || '')).replace(/\$\(([a-z0-9-]+)\)/gi, function (_m, icon) {
                    return '<span class="codicon codicon-' + icon + '" style="margin-right:4px"></span>';
                });
            }

            list.innerHTML =
                '<ul class="history-list">' +
                history.map(function (item, idx) {
                    const isError = item.type === 'error';
                    return '<li>' +
                        '<div class="history-row" onclick="toggleDrawer(' + idx + ')">' +
                        '<span class="drawer-arrow' + (openIdx === idx ? ' open' : '') + '">&#9654;</span>' +
                        getTypeIcon(item.type, item.status, item.protocol) +
                        getMethodOrProtocolBadge(item) +
                        '<span class="history-title"' + (isError || item.status >= 400 ? ' style="color:#ff5555;"' : '') + '>' + escapeHtml(displayTitle(item)) + '</span>' +
                        '<span class="history-time">' +
                        (item.duration >= 0
                            ? '<span style="color:' + (isError || item.status >= 400 ? '#ff5555' : '#66bb6a') + ';">(' + item.duration + 'ms)</span> '
                            : '') +
                        (item.status !== undefined
                            ? (
                                isError || item.status >= 400
                                    ? '<span style="color:#ff5555;font-weight: bold;">[' + item.status + ']</span> '
                                    : '<span style="color:#66bb6a;font-weight: bold;">[' + item.status + ']</span> '
                            )
                            : ''
                        ) +
                        item.time +
                        '</span>' +
                        '</div>' +
                        (openIdx === idx
                            ? '<div class="drawer-content">' +
                            '<div class="drawer-section"><span class="drawer-section-title">Method</span><div class="drawer-sub"><span class="drawer-value">' + item.method + '</span></div></div>' +
                            '<div class="drawer-section"><span class="drawer-section-title">Protocol</span><div class="drawer-sub"><span class="drawer-value">' + item.protocol + '</span></div></div>' +
                            (item.status !== undefined
                                ? (
                                    isError || item.status >= 400
                                        ? '<div class="drawer-section"><span class="drawer-section-title">Status</span><div class="drawer-sub"><span class="drawer-value" style="color:#ff5555;">' + item.status + '</span></div></div>'
                                        : '<div class="drawer-section"><span class="drawer-section-title">Status</span><div class="drawer-sub"><span class="drawer-value" style="color:#66bb6a;">' + item.status + '</span></div></div>'
                                )
                                : ''
                            ) +
                            (item.cookies && Object.keys(item.cookies).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Cookies</span><div class="drawer-sub">' + renderVerticalTable(item.cookies) + '</div></div>' : '') +
                            (item.headers && Object.keys(item.headers).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Headers</span><div class="drawer-sub">' + renderVerticalTable(item.headers) + '</div></div>' : '') +
                            (item.query && Object.keys(item.query).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Query</span><div class="drawer-sub">' + renderVerticalTable(item.query) + '</div></div>' : '') +
                            (item.content
                                ? '<div class="drawer-section"><div class="drawer-section-header"><span class="drawer-section-title">Body</span>' +
                                (canFormatBody(item.content)
                                    ? '<button type="button" class="drawer-format-btn" onclick="event.stopPropagation(); toggleBodyFormat(' + idx + ')" title="' +
                                      (formattedBodyByIdx[idx] ? 'Show raw body' : 'Format body') + '">' +
                                      (formattedBodyByIdx[idx] ? 'Raw' : 'Format') + '</button>'
                                    : '') +
                                '</div><div class="drawer-sub"><pre>' +
                                escapeHtml(formattedBodyByIdx[idx] ? tryFormatBody(item.content) : item.content) +
                                '</pre></div></div>' : '') +
                            '</div>'
                            : '') +
                        '</li>';
                }).join('') +
                '</ul>';
        }

        window.toggleDrawer = function (idx) {
            openIdx = openIdx === idx ? null : idx;
            renderHistory();
        };

        window.toggleBodyFormat = function (idx) {
            formattedBodyByIdx[idx] = !formattedBodyByIdx[idx];
            renderHistory();
        };

        window.addEventListener('message', function (event) {
            const msg = event.data;
            if (msg.command === 'refreshHistory') {
                vscode.postMessage({ type: 'refreshHistory' });
            }
        });

        window.addEventListener('message', function (event) {
            const msg = event.data;
            if (msg.command === 'setHistory') {
                window.history = msg.history;
                renderHistory();
            }
        });

        renderHistory();
    </script>
</body>

</html>
