<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://microsoft.github.io/vscode-codicons/dist/codicon.css">
</head>

<body>
    <div id="history-list"></div>
    <style>
        :root {
            --history-row-size: 12px;
            --history-meta-size: 11px;
            --history-detail-size: 11px;
            --history-section-size: 10px;
            --history-muted: var(--vscode-descriptionForeground, #888);
            --history-radius: 6px;
        }

        body {
            margin: 0;
            padding: 4px 0;
            font-family: var(--vscode-font-family, sans-serif);
            color: var(--vscode-foreground, #ccc);
        }

        .history-list {
            color: var(--vscode-foreground, #ccc);
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-row {
            display: flex;
            align-items: center;
            padding: 5px 8px;
            border-radius: var(--history-radius);
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: var(--history-row-size);
            margin-bottom: 1px;
            position: relative;
        }

        .history-row:hover {
            background: var(--vscode-list-hoverBackground, #2a2d2e);
        }

        .history-badge {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            min-width: 34px;
            max-width: 34px;
            height: 14px;
            padding: 0 2px;
            margin-right: 6px;
            border-radius: 2px;
            /* Same recipe as API method-select: button-themed fill; border matches
               button.border or equals the fill when the theme has no button border. */
            --history-brand: #888888;
            --history-badge-fill: color-mix(
                in oklab,
                var(--history-brand) 36%,
                var(--vscode-button-background, #0e639c)
            );
            color: var(--vscode-button-foreground, #fff);
            background: var(--history-badge-fill);
            border-width: 1px;
            border-style: solid;
            border-color: var(--vscode-button-border, var(--history-badge-fill));
            font-size: 8px;
            font-weight: 600;
            line-height: 14px;
            letter-spacing: 0;
            text-transform: uppercase;
            box-sizing: border-box;
            overflow: hidden;
            white-space: nowrap;
        }

        .history-badge[data-method="get"],
        .history-badge[data-method="http"] { --history-brand: #61affe; }
        .history-badge[data-method="post"] { --history-brand: #49cc90; }
        .history-badge[data-method="put"] { --history-brand: #fca130; }
        .history-badge[data-method="delete"] { --history-brand: #f93e3e; }
        .history-badge[data-method="patch"] { --history-brand: #50e3c2; }
        .history-badge[data-method="head"] { --history-brand: #9012fe; }
        .history-badge[data-method="options"] { --history-brand: #0d5aa7; }
        .history-badge[data-method="trace"] { --history-brand: #888888; }
        .history-badge[data-method="ws"] { --history-brand: #9b59b6; }
        .history-badge[data-method="graphql"] { --history-brand: #e535ab; }
        .history-badge[data-method="grpc"] { --history-brand: #244c5a; }

        /* Flat / high-contrast themes: same surface bg, accent only on text/border. */
        body.mmt-outline-chrome .history-badge {
            background: var(--vscode-input-background, var(--vscode-sideBar-background, #3c3c3c));
        }

        .history-badge-mock {
            outline: 1px solid rgba(255, 255, 255, 0.35);
            outline-offset: 0;
        }

        .history-type-icon {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 6px;
            flex-shrink: 0;
        }

        .history-type-icon .codicon {
            font-size: 14px;
            line-height: 1;
        }

        .history-type-icon-bg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.28;
            pointer-events: none;
        }

        .history-type-icon-bg .codicon {
            font-size: 16px;
        }

        .history-type-icon-fg {
            position: relative;
            z-index: 1;
        }

        .history-title {
            flex: 1;
            color: var(--vscode-foreground, #ccc);
            font-size: var(--history-row-size);
            margin-left: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-time {
            font-size: var(--history-meta-size);
            color: var(--history-muted);
            margin-left: 12px;
            min-width: 90px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .drawer-content {
            border-radius: 0 0 var(--history-radius) var(--history-radius);
            margin: 0 4px 6px 20px;
            padding: 10px 12px 12px;
            font-size: var(--history-detail-size);
            color: var(--vscode-foreground, #ccc);
            white-space: pre-wrap;
            animation: drawerOpen 0.18s ease-out;
        }

        .drawer-section {
            margin-bottom: 12px;
        }

        .drawer-section:last-child {
            margin-bottom: 0;
        }

        .drawer-section-title {
            display: block;
            font-size: var(--history-section-size);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--history-muted);
            margin-bottom: 4px;
        }

        .drawer-section-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .drawer-section-header .drawer-section-title {
            margin-bottom: 0;
        }

        .drawer-format-btn {
            padding: 1px 5px;
            font-size: 10px;
            line-height: 1.3;
            border: 1px solid var(--vscode-button-border, var(--vscode-editorWidget-border, #555));
            border-radius: 3px;
            background: var(--vscode-button-secondaryBackground, var(--vscode-input-background, transparent));
            color: var(--vscode-button-secondaryForeground, var(--vscode-foreground, #ccc));
            cursor: pointer;
        }

        .drawer-format-btn:hover {
            background: var(--vscode-button-secondaryHoverBackground, var(--vscode-toolbar-hoverBackground, rgba(255, 255, 255, 0.08)));
            border-color: var(--vscode-focusBorder, var(--vscode-button-border, #555));
        }

        .drawer-body-format {
            font-size: 10px;
            opacity: 0.55;
            text-transform: lowercase;
            padding: 0 4px;
            border: 1px solid var(--vscode-editorWidget-border, #555);
            border-radius: 3px;
            line-height: 1.4;
        }

        .drawer-body-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: auto;
        }

        .drawer-copy-btn {
            width: 22px;
            height: 20px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .drawer-copy-btn .codicon {
            font-size: 14px;
        }

        .drawer-sub {
            padding-left: 12px;
        }

        .drawer-value {
            color: var(--vscode-foreground, #ccc);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            word-break: break-all;
            line-height: 1.45;
        }

        .drawer-table {
            border-collapse: collapse;
            width: 100%;
        }

        .drawer-table th,
        .drawer-table td {
            border: none;
            padding: 2px 0;
            font-size: var(--history-detail-size);
            text-align: left;
            vertical-align: top;
            line-height: 1.45;
        }

        .drawer-table tr + tr th,
        .drawer-table tr + tr td {
            padding-top: 3px;
        }

        .drawer-table th {
            color: var(--vscode-foreground, #ccc);
            font-weight: 600;
            width: 110px;
            padding-right: 12px;
            white-space: nowrap;
        }

        .drawer-table td {
            color: var(--vscode-foreground, #ccc);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            word-break: break-all;
        }

        .drawer-content pre,
        .drawer-body-pre {
            color: var(--vscode-editor-foreground, #d4d4d4);
            background: var(
                --vscode-textCodeBlock-background,
                color-mix(in srgb, var(--vscode-editor-background, #1e1e1e) 88%, var(--vscode-foreground, #ccc) 12%)
            );
            padding: 8px 10px;
            border-radius: 4px;
            border: 1px solid var(--vscode-editorWidget-border, var(--vscode-widget-border, #555));
            font-size: var(--history-detail-size);
            font-family: var(--vscode-editor-font-family, var(--vscode-font-family, monospace));
            margin: 0;
            overflow-x: auto;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 360px;
        }

        .bh-key { color: var(--mmt-token-key, var(--vscode-symbolIcon-keyForeground, #9cdcfe)); }
        .bh-string { color: var(--mmt-token-string, var(--vscode-symbolIcon-stringForeground, #ce9178)); }
        .bh-number { color: var(--mmt-token-number, var(--vscode-symbolIcon-numberForeground, #b5cea8)); }
        .bh-keyword { color: var(--mmt-token-keyword, var(--vscode-symbolIcon-keywordForeground, #569cd6)); }
        .bh-punct { color: var(--mmt-token-punctuation, var(--vscode-editor-foreground, #d4d4d4)); }
        .bh-tag { color: var(--mmt-token-tag, var(--mmt-token-key, #569cd6)); }
        .bh-attr { color: var(--mmt-token-attribute, var(--mmt-token-key, #9cdcfe)); }
        .bh-comment { color: var(--mmt-token-comment, #6a9955); }
        .bh-text { color: var(--mmt-token-foreground, var(--vscode-editor-foreground, #d4d4d4)); }

        @keyframes drawerOpen {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .drawer-arrow {
            margin-right: 6px;
            font-size: 13px;
            color: var(--vscode-foreground, #aaa);
            transition: transform 0.2s;
            cursor: pointer;
            user-select: none;
        }

        .drawer-arrow.open {
            transform: rotate(90deg);
            color: #3399ff;
        }

        /* Enable horizontal scrolling when panel is narrow */
        @media (max-width: 400px) {
            body {
                overflow-x: auto;
                min-width: 400px;
            }
        }
    </style>
    <script>
        const vscode = acquireVsCodeApi();
        let history = __HISTORY_DATA__;
        const initialTokenColors = __TOKEN_COLORS__;
        let openIdx = __OPEN_IDX__;

        function applyTokenColors(tokenColors) {
            if (!tokenColors) {
                return;
            }
            function hex(value) {
                if (value == null || value === '') {
                    return '';
                }
                var v = String(value);
                return v.charAt(0) === '#' ? v : ('#' + v);
            }
            var root = document.documentElement.style;
            var body = document.body && document.body.style;
            function setVar(name, value) {
                var h = hex(value);
                if (!h) {
                    return;
                }
                root.setProperty(name, h);
                if (body) {
                    body.setProperty(name, h);
                }
            }
            setVar('--mmt-token-key', tokenColors.key);
            setVar('--mmt-token-string', tokenColors.string);
            setVar('--mmt-token-number', tokenColors.number);
            setVar('--mmt-token-keyword', tokenColors.keyword);
            setVar('--mmt-token-comment', tokenColors.comment);
            setVar('--mmt-token-tag', tokenColors.tag);
            setVar('--mmt-token-attribute', tokenColors.attribute);
            setVar('--mmt-token-punctuation', tokenColors.punctuation);
            setVar('--mmt-token-foreground', tokenColors.foreground);

            // Also stamp a style tag so colors win even if var() cascade is flaky.
            var style = document.getElementById('mmt-token-colors');
            if (!style) {
                style = document.createElement('style');
                style.id = 'mmt-token-colors';
                document.head.appendChild(style);
            }
            style.textContent =
                '.bh-key { color: ' + hex(tokenColors.key) + ' !important; }' +
                '.bh-string { color: ' + hex(tokenColors.string) + ' !important; }' +
                '.bh-number { color: ' + hex(tokenColors.number) + ' !important; }' +
                '.bh-keyword { color: ' + hex(tokenColors.keyword) + ' !important; }' +
                '.bh-punct { color: ' + hex(tokenColors.punctuation) + ' !important; }' +
                '.bh-tag { color: ' + hex(tokenColors.tag) + ' !important; }' +
                '.bh-attr { color: ' + hex(tokenColors.attribute) + ' !important; }' +
                '.bh-comment { color: ' + hex(tokenColors.comment) + ' !important; }' +
                '.bh-text { color: ' + hex(tokenColors.foreground) + ' !important; }';
        }
        applyTokenColors(initialTokenColors);

        function requestThemeTokens() {
            var themeId = document.body.getAttribute('data-vscode-theme-id') ||
                (document.body.dataset && document.body.dataset.vscodeThemeId) ||
                undefined;
            var themeName = document.body.getAttribute('data-vscode-theme-name') ||
                (document.body.dataset && document.body.dataset.vscodeThemeName) ||
                undefined;
            vscode.postMessage({
                command: 'requestThemeTokens',
                themeId: themeId,
                themeName: themeName
            });
        }
        // Ask host after load, and whenever VS Code updates the webview theme attrs.
        requestThemeTokens();
        try {
            var themeRequestTimer = null;
            var themeObserver = new MutationObserver(function () {
                if (themeRequestTimer) {
                    clearTimeout(themeRequestTimer);
                }
                themeRequestTimer = setTimeout(function () {
                    themeRequestTimer = null;
                    requestThemeTokens();
                    // Recompute badge/status chrome against freshly injected CSS vars.
                    renderHistory();
                }, 40);
            });
            themeObserver.observe(document.body, {
                attributes: true,
                attributeFilter: [
                    'data-vscode-theme-id',
                    'data-vscode-theme-name',
                    'data-vscode-theme-kind',
                    'class'
                ]
            });
        } catch (e) { /* ignore */ }
        /** Per-item body format toggle: idx -> true when showing beautified body. */
        var formattedBodyByIdx = {};
        /** Brief "Copied" feedback per body idx. */
        var copiedBodyByIdx = {};

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function headerValue(headers, name) {
            if (!headers) {
                return '';
            }
            var target = String(name).toLowerCase();
            var keys = Object.keys(headers);
            for (var i = 0; i < keys.length; i++) {
                if (String(keys[i]).toLowerCase() === target) {
                    return headers[keys[i]] == null ? '' : String(headers[keys[i]]);
                }
            }
            return '';
        }

        function detectBodyFormat(content, headers) {
            var ct = headerValue(headers, 'content-type').toLowerCase();
            if (ct.indexOf('json') >= 0) {
                return 'json';
            }
            if (ct.indexOf('xml') >= 0 || ct.indexOf('html') >= 0) {
                return 'xml';
            }
            if (ct.indexOf('urlencoded') >= 0 || ct.indexOf('x-www-form-urlencoded') >= 0) {
                return 'urlencoded';
            }
            var text = content == null ? '' : String(content);
            var trimmed = text.replace(/^\s+/, '');
            if (!trimmed) {
                return 'text';
            }
            if (trimmed.charAt(0) === '{' || trimmed.charAt(0) === '[') {
                try {
                    JSON.parse(text);
                    return 'json';
                } catch (e) { /* fall through */ }
            }
            if (trimmed.charAt(0) === '<') {
                return 'xml';
            }
            if (/^[^=&\s]+=/.test(trimmed) && trimmed.indexOf('=') >= 0 && trimmed.indexOf('\n') < 0) {
                return 'urlencoded';
            }
            return 'text';
        }

        function indentXml(xml) {
            var padded = xml.replace(/(>)(<)(\/*)/g, '$1\n$2$3');
            var lines = padded.split('\n');
            var indent = 0;
            var out = [];
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) {
                    continue;
                }
                if (/^<\/\w/.test(line)) {
                    indent = Math.max(indent - 1, 0);
                }
                out.push(new Array(indent + 1).join('  ') + line);
                if (/^<\w[^>]*[^\/]>.*$/.test(line) && !/^<.*>.*<\/\w/.test(line)) {
                    indent += 1;
                }
            }
            return out.join('\n');
        }

        function formatUrlEncoded(body) {
            return String(body).split('&').filter(function (part) {
                return part.length > 0;
            }).map(function (part) {
                var eq = part.indexOf('=');
                if (eq < 0) {
                    try { return decodeURIComponent(part.replace(/\+/g, ' ')); } catch (e) { return part; }
                }
                var key = part.slice(0, eq);
                var value = part.slice(eq + 1);
                try { key = decodeURIComponent(key.replace(/\+/g, ' ')); } catch (e) { /* keep */ }
                try { value = decodeURIComponent(value.replace(/\+/g, ' ')); } catch (e) { /* keep */ }
                return key + '=' + value;
            }).join('&\n');
        }

        function tryFormatBody(content, headers) {
            if (content == null) {
                return '';
            }
            var text = String(content);
            var format = detectBodyFormat(text, headers);
            try {
                if (format === 'json') {
                    return JSON.stringify(JSON.parse(text), null, 2);
                }
                if (format === 'xml') {
                    return indentXml(text);
                }
                if (format === 'urlencoded') {
                    return formatUrlEncoded(text);
                }
            } catch (e) { /* leave raw */ }
            return text;
        }

        function canFormatBody(content, headers) {
            if (content == null || content === '') {
                return false;
            }
            var format = detectBodyFormat(String(content), headers);
            if (format === 'json') {
                try {
                    JSON.parse(String(content));
                    return true;
                } catch (e) {
                    return false;
                }
            }
            return format === 'xml' || format === 'urlencoded';
        }

        function spanCls(cls, text) {
            return '<span class="' + cls + '">' + escapeHtml(text) + '</span>';
        }

        function highlightJson(text) {
            // Keep whitespace after strings in its own group so newlines before `}` are preserved.
            var re = /("(?:\\.|[^"\\])*")(\s*)(:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b|([{}\[\],])/g;
            var out = '';
            var last = 0;
            var match;
            while ((match = re.exec(text)) !== null) {
                if (match.index > last) {
                    out += escapeHtml(text.slice(last, match.index));
                }
                if (match[1] !== undefined) {
                    out += spanCls(match[3] ? 'bh-key' : 'bh-string', match[1]);
                    if (match[2]) {
                        out += escapeHtml(match[2]);
                    }
                    if (match[3]) {
                        out += spanCls('bh-punct', match[3]);
                    }
                } else if (match[4] !== undefined) {
                    out += spanCls('bh-number', match[4]);
                } else if (match[5] !== undefined) {
                    out += spanCls('bh-keyword', match[5]);
                } else if (match[6] !== undefined) {
                    out += spanCls('bh-punct', match[6]);
                }
                last = match.index + match[0].length;
            }
            if (last < text.length) {
                out += escapeHtml(text.slice(last));
            }
            return out;
        }

        function highlightXml(text) {
            var re = /(<!--[\s\S]*?-->)|(<\?[\s\S]*?\?>)|(<\/?[A-Za-z_][\w:.-]*)|(\/?>)|(=)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|([^<\s="'\/]+)/g;
            var out = '';
            var last = 0;
            var inTag = false;
            var match;
            while ((match = re.exec(text)) !== null) {
                if (match.index > last) {
                    out += escapeHtml(text.slice(last, match.index));
                }
                if (match[1]) {
                    out += spanCls('bh-comment', match[1]);
                } else if (match[2]) {
                    out += spanCls('bh-tag', match[2]);
                } else if (match[3]) {
                    inTag = true;
                    out += spanCls('bh-tag', match[3]);
                } else if (match[4]) {
                    inTag = false;
                    out += spanCls('bh-punct', match[4]);
                } else if (match[5]) {
                    out += spanCls('bh-punct', match[5]);
                } else if (match[6]) {
                    out += spanCls('bh-string', match[6]);
                } else if (match[7]) {
                    out += spanCls(inTag ? 'bh-attr' : 'bh-text', match[7]);
                }
                last = match.index + match[0].length;
            }
            if (last < text.length) {
                out += escapeHtml(text.slice(last));
            }
            return out;
        }

        function highlightUrlEncoded(text) {
            return String(text).split(/(\n|&)/).map(function (part) {
                if (part === '\n' || part === '&') {
                    return spanCls('bh-punct', part);
                }
                if (!part) {
                    return '';
                }
                var eq = part.indexOf('=');
                if (eq < 0) {
                    return spanCls('bh-key', part);
                }
                return spanCls('bh-key', part.slice(0, eq)) +
                    spanCls('bh-punct', '=') +
                    spanCls('bh-string', part.slice(eq + 1));
            }).join('');
        }

        function highlightBodyHtml(content, headers) {
            var text = content == null ? '' : String(content);
            var format = detectBodyFormat(text, headers);
            if (format === 'json') {
                return highlightJson(text);
            }
            if (format === 'xml') {
                return highlightXml(text);
            }
            if (format === 'urlencoded') {
                return highlightUrlEncoded(text);
            }
            return escapeHtml(text);
        }

        function getTypeIcon(type, status, protocol) {
            var isMock = String(protocol || '').toLowerCase() === 'mock';
            var raw;
            if (type === 'send') {
                raw = '#3399ff';
            } else if (type === 'recv' && !(status >= 400)) {
                raw = '#66bb6a';
            } else {
                raw = '#ff5555';
            }
            var color = harmonizeBadgeAccent(raw).text;
            var fg;
            if (type === 'send') {
                fg = '<span class="codicon codicon-arrow-up history-type-icon-fg" style="color:' + color + '"></span>';
            } else if (type === 'recv' && !(status >= 400)) {
                fg = '<span class="codicon codicon-arrow-down history-type-icon-fg" style="color:' + color + '"></span>';
            } else {
                fg = '<span class="codicon codicon-arrow-down history-type-icon-fg" style="color:' + color + '"></span>';
            }
            var bg = isMock
                ? '<span class="history-type-icon-bg" title="Mock server" style="color:' + color + '"><span class="codicon codicon-vm-compact"></span></span>'
                : '';
            return '<span class="history-type-icon">' + bg + fg + '</span>';
        }

        // Same brand hues as the API tester; mixed into the active theme below.
        var METHOD_PROTOCOL_COLORS = {
            get: '#61affe',
            post: '#49cc90',
            put: '#fca130',
            delete: '#f93e3e',
            patch: '#50e3c2',
            head: '#9012fe',
            options: '#0d5aa7',
            trace: '#888',
            ws: '#9b59b6',
            graphql: '#e535ab',
            grpc: '#244c5a',
            http: '#61affe'
        };
        var PROTOCOL_LABELS = {
            ws: 'WS',
            graphql: 'GraphQL',
            grpc: 'gRPC'
        };

        function readCssColor(name, fallback) {
            try {
                var v = getComputedStyle(document.documentElement).getPropertyValue(name);
                return (v && v.trim()) || fallback;
            } catch (e) {
                return fallback;
            }
        }

        function parseHexRgb(cssColor) {
            var s = String(cssColor || '').trim();
            var m = s.match(/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})/);
            if (m) {
                var h = m[1];
                if (h.length === 3) {
                    h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                }
                return {
                    r: parseInt(h.slice(0, 2), 16),
                    g: parseInt(h.slice(2, 4), 16),
                    b: parseInt(h.slice(4, 6), 16)
                };
            }
            try {
                var el = document.createElement('span');
                el.style.color = s;
                el.style.position = 'fixed';
                el.style.left = '-9999px';
                document.body.appendChild(el);
                var resolved = getComputedStyle(el).color;
                document.body.removeChild(el);
                var rm = String(resolved).match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
                if (rm) {
                    return { r: Number(rm[1]), g: Number(rm[2]), b: Number(rm[3]) };
                }
            } catch (e) { /* ignore */ }
            return null;
        }

        function srgbToLinear(c) {
            var s = c / 255;
            return s <= 0.04045 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
        }

        function linearToSrgb(c) {
            var s = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
            return Math.round(Math.max(0, Math.min(1, s)) * 255);
        }

        function rgbToOklab(r, g, b) {
            var lr = srgbToLinear(r), lg = srgbToLinear(g), lb = srgbToLinear(b);
            var l = 0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb;
            var m = 0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb;
            var s = 0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb;
            var l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
            return {
                L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
                a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
                b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
            };
        }

        function oklabToRgb(L, a, b) {
            var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
            var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
            var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
            var l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
            return {
                r: linearToSrgb(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
                g: linearToSrgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
                b: linearToSrgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)
            };
        }

        function rgbToHex(r, g, b) {
            function hx(n) {
                return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, '0');
            }
            return '#' + hx(r) + hx(g) + hx(b);
        }

        /** Opaque OKLab mix (no transparency): accentPercent% accent + remainder base. */
        function mixOpaque(accent, base, accentPercent) {
            var pct = Math.max(0, Math.min(100, accentPercent)) / 100;
            var a = parseHexRgb(accent);
            var b = parseHexRgb(base);
            if (!a || !b) {
                return accent;
            }
            var oa = rgbToOklab(a.r, a.g, a.b);
            var ob = rgbToOklab(b.r, b.g, b.b);
            var rgb = oklabToRgb(
                oa.L * pct + ob.L * (1 - pct),
                oa.a * pct + ob.a * (1 - pct),
                oa.b * pct + ob.b * (1 - pct)
            );
            return rgbToHex(rgb.r, rgb.g, rgb.b);
        }

        function relativeLuminance(cssColor) {
            var rgb = parseHexRgb(cssColor);
            if (!rgb) {
                return 0.5;
            }
            function lin(c) {
                var s = c / 255;
                return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
            }
            return 0.2126 * lin(rgb.r) + 0.7152 * lin(rgb.g) + 0.0722 * lin(rgb.b);
        }

        function contrastingForeground(fill) {
            return relativeLuminance(fill) > 0.45 ? '#1e1e1e' : '#ffffff';
        }

        function colorsNearlyEqual(a, b, maxDelta) {
            var ar = parseHexRgb(a);
            var br = parseHexRgb(b);
            if (!ar || !br) {
                return false;
            }
            var d = maxDelta == null ? 10 : maxDelta;
            return Math.abs(ar.r - br.r) <= d &&
                Math.abs(ar.g - br.g) <= d &&
                Math.abs(ar.b - br.b) <= d;
        }

        function readThemeSurfaces() {
            var background = readCssColor('--vscode-editor-background', '#1e1e1e');
            var surface = readCssColor('--vscode-input-background',
                readCssColor('--vscode-sideBar-background', '#3c3c3c'));
            return {
                background: background,
                foreground: readCssColor('--vscode-editor-foreground', '#cccccc'),
                surface: surface,
                buttonBackground: readCssColor('--vscode-button-background', '#0e639c')
            };
        }

        function isOutlineButtonTheme(surfaces) {
            return colorsNearlyEqual(surfaces.buttonBackground, surfaces.background) ||
                colorsNearlyEqual(surfaces.buttonBackground, surfaces.surface);
        }

        /**
         * Same roles as mmtview/src/shared/themeAccent.ts harmonizeAccent.
         * History badges + API method select both use softFill + text + border.
         */
        function harmonizeBadgeAccent(accent) {
            var surfaces = readThemeSurfaces();
            var outline = isOutlineButtonTheme(surfaces);
            var text = mixOpaque(accent, surfaces.foreground, 62);
            var border = mixOpaque(accent, surfaces.foreground, 70);
            if (outline) {
                return {
                    text: text,
                    border: border,
                    softFill: surfaces.surface,
                    fill: surfaces.surface,
                    onFill: text,
                    surface: surfaces.surface,
                    outline: true
                };
            }
            var softFill = mixOpaque(accent, surfaces.surface, 32);
            var fill = mixOpaque(accent, surfaces.background, 52);
            return {
                text: text,
                border: border,
                softFill: softFill,
                fill: fill,
                onFill: contrastingForeground(fill),
                surface: surfaces.surface,
                outline: false
            };
        }

        function statusAccentColor(isError) {
            return harmonizeBadgeAccent(isError ? '#ff5555' : '#66bb6a').text;
        }

        function syncOutlineChromeClass() {
            try {
                var outline = isOutlineButtonTheme(readThemeSurfaces());
                document.body.classList.toggle('mmt-outline-chrome', outline);
            } catch (e) { /* ignore */ }
        }

        function getMethodOrProtocolBadge(item) {
            var protocol = String(item.protocol || 'http').trim().toLowerCase();
            var method = String(item.method || 'get').trim().toLowerCase();
            // Normalize "POST ", "post/echo", etc. to a known method key.
            var methodMatch = method.match(/^(get|post|put|delete|patch|head|options|trace)\b/);
            if (methodMatch) {
                method = methodMatch[1];
            }
            var serverType = String(item.serverType || '').trim().toLowerCase();
            var isMock = protocol === 'mock';
            var label;
            var colorKey;

            if (isMock) {
                if (serverType === 'ws' || method === 'ws') {
                    label = PROTOCOL_LABELS.ws;
                    colorKey = 'ws';
                } else if (serverType === 'graphql' || method === 'graphql') {
                    label = PROTOCOL_LABELS.graphql;
                    colorKey = 'graphql';
                } else if (serverType === 'grpc' || method === 'grpc') {
                    label = PROTOCOL_LABELS.grpc;
                    colorKey = 'grpc';
                } else {
                    label = method.toUpperCase();
                    colorKey = METHOD_PROTOCOL_COLORS[method] ? method : 'get';
                }
            } else if (protocol === 'ws' || protocol === 'graphql' || protocol === 'grpc') {
                label = PROTOCOL_LABELS[protocol] || protocol.toUpperCase();
                colorKey = protocol;
            } else {
                label = method.toUpperCase();
                colorKey = METHOD_PROTOCOL_COLORS[method] ? method : 'get';
            }

            var display = String(label).trim().toUpperCase();
            // Accent must follow the visible label (POST → green), never fall back to GET blue.
            var labelKey = display.toLowerCase();
            if (!METHOD_PROTOCOL_COLORS[labelKey] && METHOD_PROTOCOL_COLORS[colorKey]) {
                labelKey = colorKey;
            }
            var mockClass = isMock ? ' history-badge-mock' : '';
            var len = display.length;
            var fontSize = len <= 4 ? '8px' : len <= 5 ? '7px' : len <= 6 ? '6.5px' : '5.5px';
            // Brand hue comes from data-method + CSS color-mix (same recipe as API method-select).
            return '<span class="history-badge' + mockClass +
                '" data-method="' + labelKey +
                '" style="font-size:' + fontSize + '" title="' +
                (isMock ? 'mock ' : '') + display + '">' + display + '</span>';
        }

        function displayTitle(item) {
            var title = String(item.title || '');
            var urlMatch = title.match(/((?:https?|wss?):\/\/\S+)/i);
            if (urlMatch) {
                return urlMatch[1];
            }
            return title.replace(
                /^(GET|POST|PUT|DELETE|PATCH|HEAD|OPTIONS|TRACE|send|recv|connnect|connect|connected|closed|error|close|gRPC)\s+/i,
                ''
            ).replace(/\s+Error$/i, '');
        }

        function renderVerticalTable(obj) {
            if (!obj || Object.keys(obj).length === 0) return '';
            return '<table class="drawer-table">' +
                Object.entries(obj).map(function ([key, val]) {
                    return '<tr><th>' + key + '</th><td>' + val + '</td></tr>';
                }).join('') +
                '</table>';
        }

        function renderHistory() {
            syncOutlineChromeClass();
            const list = document.getElementById('history-list');

            function renderCodicons(text) {
                // Supports VS Code codicon string syntax: $(icon-name)
                // Example: $(server) $(arrow-up)
                return escapeHtml(String(text || '')).replace(/\$\(([a-z0-9-]+)\)/gi, function (_m, icon) {
                    return '<span class="codicon codicon-' + icon + '" style="margin-right:4px"></span>';
                });
            }

            list.innerHTML =
                '<ul class="history-list">' +
                history.map(function (item, idx) {
                    const isError = item.type === 'error';
                    const errTone = isError || item.status >= 400;
                    const statusColor = statusAccentColor(errTone);
                    const bodyText = item.content == null ? '' : String(item.content);
                    const displayBody = formattedBodyByIdx[idx]
                        ? tryFormatBody(bodyText, item.headers)
                        : bodyText;
                    const bodyFormat = bodyText ? detectBodyFormat(displayBody, item.headers) : '';
                    return '<li>' +
                        '<div class="history-row" onclick="toggleDrawer(' + idx + ')">' +
                        '<span class="drawer-arrow' + (openIdx === idx ? ' open' : '') + '">&#9654;</span>' +
                        getTypeIcon(item.type, item.status, item.protocol) +
                        getMethodOrProtocolBadge(item) +
                        '<span class="history-title"' + (errTone ? ' style="color:' + statusColor + ';"' : '') + '>' + escapeHtml(displayTitle(item)) + '</span>' +
                        '<span class="history-time">' +
                        (item.duration >= 0
                            ? '<span style="color:' + statusColor + ';">(' + item.duration + 'ms)</span> '
                            : '') +
                        (item.status !== undefined
                            ? '<span style="color:' + statusColor + ';font-weight: bold;">[' + item.status + ']</span> '
                            : ''
                        ) +
                        item.time +
                        '</span>' +
                        '</div>' +
                        (openIdx === idx
                            ? '<div class="drawer-content">' +
                            '<div class="drawer-section"><span class="drawer-section-title">Method</span><div class="drawer-sub"><span class="drawer-value">' + item.method + '</span></div></div>' +
                            '<div class="drawer-section"><span class="drawer-section-title">Protocol</span><div class="drawer-sub"><span class="drawer-value">' + item.protocol + '</span></div></div>' +
                            (item.status !== undefined
                                ? '<div class="drawer-section"><span class="drawer-section-title">Status</span><div class="drawer-sub"><span class="drawer-value" style="color:' + statusColor + ';">' + item.status + '</span></div></div>'
                                : ''
                            ) +
                            (item.cookies && Object.keys(item.cookies).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Cookies</span><div class="drawer-sub">' + renderVerticalTable(item.cookies) + '</div></div>' : '') +
                            (item.headers && Object.keys(item.headers).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Headers</span><div class="drawer-sub">' + renderVerticalTable(item.headers) + '</div></div>' : '') +
                            (item.query && Object.keys(item.query).length
                                ? '<div class="drawer-section"><span class="drawer-section-title">Query</span><div class="drawer-sub">' + renderVerticalTable(item.query) + '</div></div>' : '') +
                            (bodyText
                                ? '<div class="drawer-section"><div class="drawer-section-header"><span class="drawer-section-title">Body</span>' +
                                '<span class="drawer-body-format" title="Detected body type">' + escapeHtml(bodyFormat) + '</span>' +
                                '<div class="drawer-body-actions">' +
                                (canFormatBody(bodyText, item.headers)
                                    ? '<button type="button" class="drawer-format-btn" onclick="event.stopPropagation(); toggleBodyFormat(' + idx + ')" title="' +
                                      (formattedBodyByIdx[idx] ? 'Show raw body' : 'Format body') + '">' +
                                      (formattedBodyByIdx[idx] ? 'Raw' : 'Format') + '</button>'
                                    : '') +
                                '<button type="button" class="drawer-format-btn drawer-copy-btn" onclick="event.stopPropagation(); copyHistoryBody(' + idx + ')" title="' +
                                  (copiedBodyByIdx[idx] ? 'Copied' : 'Copy body') + '">' +
                                  '<span class="codicon ' + (copiedBodyByIdx[idx] ? 'codicon-check' : 'codicon-copy') + '"></span></button>' +
                                '</div></div><div class="drawer-sub"><pre class="drawer-body-pre bh-' + escapeHtml(bodyFormat) + '">' +
                                highlightBodyHtml(displayBody, item.headers) +
                                '</pre></div></div>' : '') +
                            '</div>'
                            : '') +
                        '</li>';
                }).join('') +
                '</ul>';
        }

        window.toggleDrawer = function (idx) {
            var opening = openIdx !== idx;
            openIdx = opening ? idx : null;
            try {
                vscode.postMessage({ command: 'historyOpenIdx', idx: openIdx });
            } catch (e) { /* ignore */ }
            // Pretty-print only when this row is opened (not for the whole list).
            if (opening) {
                var item = history[idx];
                if (item && canFormatBody(item.content, item.headers)) {
                    formattedBodyByIdx[idx] = true;
                }
            }
            renderHistory();
        };

        window.toggleBodyFormat = function (idx) {
            formattedBodyByIdx[idx] = !formattedBodyByIdx[idx];
            renderHistory();
        };

        window.copyHistoryBody = function (idx) {
            var item = history[idx];
            if (!item || item.content == null) {
                return;
            }
            var text = formattedBodyByIdx[idx]
                ? tryFormatBody(String(item.content), item.headers)
                : String(item.content);
            function markCopied() {
                copiedBodyByIdx[idx] = true;
                renderHistory();
                window.setTimeout(function () {
                    copiedBodyByIdx[idx] = false;
                    renderHistory();
                }, 1200);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(markCopied).catch(function () {
                    // ignore
                });
            }
        };

        window.addEventListener('message', function (event) {
            const msg = event.data;
            if (!msg) {
                return;
            }
            if (msg.type === 'vscode:changeColorTheme') {
                applyTokenColors(msg.tokenColors);
                // Badge / status colors are inline; recompute against new theme surfaces.
                renderHistory();
            }
            if (msg.command === 'refreshHistory') {
                vscode.postMessage({ type: 'refreshHistory' });
            }
            if (msg.command === 'setHistory') {
                history = msg.history || [];
                renderHistory();
            }
        });

        renderHistory();
    </script>
</body>

</html>
