<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons@0.0.45/dist/codicon.css">
</head>

<body>
    <div id="connections-panel">
        <div id="connections-list"></div>
    </div>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, sans-serif);
            font-size: 12px;
            color: var(--vscode-foreground, #ccc);
            user-select: none;
            -webkit-user-select: none;
        }

        input,
        textarea,
        select,
        [contenteditable="true"] {
            user-select: text;
            -webkit-user-select: text;
        }

        #connections-panel {
            padding: 8px;
        }

        #connections-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--vscode-descriptionForeground, #888);
        }

        .empty-state .codicon {
            font-size: 32px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .connection-row {
            display: flex;
            align-items: center;
            padding: 7px 8px;
            border-radius: 4px;
            gap: 8px;
        }

        .connection-row:hover,
        .connection-row:focus-within {
            background: var(--vscode-list-hoverBackground, #2a2d2e);
        }

        .connection-state {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .connection-state.connecting {
            background: #3399ff;
            animation: pulse 1s infinite;
        }

        .connection-state.open {
            background: #66bb6a;
        }

        .connection-state.idle {
            background: #ffaa00;
        }

        .connection-state.closing {
            background: #ff5555;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .connection-icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .connection-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .connection-host {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .connection-details {
            font-size: 11px;
            color: var(--vscode-descriptionForeground, #888);
            display: flex;
            gap: 8px;
            margin-top: 2px;
            flex-wrap: wrap;
        }

        .connection-detail {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .connection-actions {
            display: none;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
            margin-left: 4px;
        }

        .connection-row:hover .connection-actions,
        .connection-row:focus-within .connection-actions {
            display: flex;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--vscode-icon-foreground, #c5c5c5);
            cursor: pointer;
        }

        .action-btn:hover {
            background: var(--vscode-toolbar-hoverBackground, #333);
            color: #ff5555;
        }

        .protocol-badge {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 4px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .protocol-badge.http {
            background: rgba(51, 153, 255, 0.2);
            color: #3399ff;
        }

        .protocol-badge.https {
            background: rgba(102, 187, 106, 0.2);
            color: #66bb6a;
        }

        .protocol-badge.ws {
            background: rgba(255, 170, 0, 0.2);
            color: #ffaa00;
        }

        .protocol-badge.wss {
            background: rgba(186, 104, 200, 0.2);
            color: #ba68c8;
        }

        @media (max-width: 300px) {
            body {
                overflow-x: auto;
                min-width: 300px;
            }
        }
    </style>

    <script>
        const vscode = acquireVsCodeApi();
        let connections = {};
        let lastStructureKey = '';
        const listEl = document.getElementById('connections-list');

        function formatDuration(ms) {
            const seconds = Math.floor(ms / 1000);
            if (seconds < 60) return seconds + 's';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return minutes + 'm ' + (seconds % 60) + 's';
            const hours = Math.floor(minutes / 60);
            return hours + 'h ' + (minutes % 60) + 'm';
        }

        function formatTimeAgo(timestamp) {
            const ms = Date.now() - timestamp;
            return formatDuration(ms) + ' ago';
        }

        function getStateLabel(state) {
            switch (state) {
                case 'connecting': return 'connecting...';
                case 'open': return 'open';
                case 'idle': return 'idle';
                case 'closing': return 'closing...';
                default: return state;
            }
        }

        function getProtocolIcon(protocol) {
            if (protocol === 'ws' || protocol === 'wss') {
                return '<img src="__WS_ICON__" class="connection-icon" />';
            }
            return '<img src="__HTTP_ICON__" class="connection-icon" />';
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sortedConnections() {
            return Object.values(connections).sort((a, b) => b.lastActivityAt - a.lastActivityAt);
        }

        function structureKey(list) {
            return list.map(c => [
                c.id,
                c.host,
                c.protocol,
                c.state,
                c.requestCount || 0,
            ].join('|')).join('\n');
        }

        function closeConnection(id) {
            if (!id) {
                return;
            }
            vscode.postMessage({ command: 'closeConnection', id: String(id) });
        }

        listEl.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-action="close"]');
            if (!btn || !listEl.contains(btn)) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            closeConnection(btn.getAttribute('data-id'));
        });

        function updateTimesOnly() {
            listEl.querySelectorAll('.connection-row').forEach((row) => {
                const id = row.getAttribute('data-id');
                const conn = id ? connections[id] : undefined;
                if (!conn) {
                    return;
                }
                const durationEl = row.querySelector('[data-field="duration"]');
                if (durationEl) {
                    durationEl.textContent = formatDuration(Date.now() - conn.connectedAt);
                }
                const lastEl = row.querySelector('[data-field="last"]');
                if (lastEl) {
                    if (conn.state === 'idle') {
                        lastEl.style.display = '';
                        lastEl.textContent = 'last: ' + formatTimeAgo(conn.lastActivityAt);
                    } else {
                        lastEl.style.display = 'none';
                    }
                }
            });
        }

        function renderConnections() {
            const connArray = sortedConnections();

            if (connArray.length === 0) {
                lastStructureKey = '';
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="codicon codicon-plug"></div>
                        <div>No active connections</div>
                    </div>
                `;
                return;
            }

            lastStructureKey = structureKey(connArray);
            listEl.innerHTML = connArray.map(conn => {
                const duration = formatDuration(Date.now() - conn.connectedAt);
                const showLast = conn.state === 'idle';
                const lastActivity = showLast ? 'last: ' + formatTimeAgo(conn.lastActivityAt) : '';
                const requestInfo = conn.requestCount > 0
                    ? conn.requestCount + ' req' + (conn.requestCount > 1 ? 's' : '')
                    : '';

                return `
                    <div class="connection-row" data-id="${escapeHtml(conn.id)}">
                        <div class="connection-state ${escapeHtml(conn.state)}" title="${escapeHtml(getStateLabel(conn.state))}"></div>
                        ${getProtocolIcon(conn.protocol)}
                        <div class="connection-info">
                            <div class="connection-host" title="${escapeHtml(conn.host)}">${escapeHtml(conn.host)}</div>
                            <div class="connection-details">
                                <span class="protocol-badge ${escapeHtml(conn.protocol)}">${escapeHtml(conn.protocol)}</span>
                                <span class="connection-detail">${escapeHtml(getStateLabel(conn.state))}</span>
                                ${requestInfo ? `<span class="connection-detail">${escapeHtml(requestInfo)}</span>` : ''}
                                <span class="connection-detail" data-field="duration">${escapeHtml(duration)}</span>
                                <span class="connection-detail" data-field="last" style="${showLast ? '' : 'display:none'}">${escapeHtml(lastActivity)}</span>
                            </div>
                        </div>
                        <div class="connection-actions">
                            <button type="button" class="action-btn" data-action="close" data-id="${escapeHtml(conn.id)}" title="Close connection" aria-label="Close connection">
                                <span class="codicon codicon-close" aria-hidden="true"></span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.addEventListener('message', (event) => {
            const msg = event.data;
            switch (msg.command) {
                case 'setConnections':
                    connections = {};
                    (msg.connections || []).forEach(conn => {
                        connections[conn.id] = conn;
                    });
                    renderConnections();
                    break;
                case 'updateConnection':
                    connections[msg.connection.id] = msg.connection;
                    renderConnections();
                    break;
                case 'removeConnection':
                    delete connections[msg.id];
                    renderConnections();
                    break;
                case 'tick': {
                    const nextKey = structureKey(sortedConnections());
                    if (nextKey !== lastStructureKey) {
                        renderConnections();
                    } else {
                        updateTimesOnly();
                    }
                    break;
                }
            }
        });

        renderConnections();
    </script>
</body>

</html>
