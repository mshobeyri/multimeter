<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css">
  <style>
    body {
      padding: 14px 12px 18px;
    }

    .start-progress-track {
      height: 4px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--foreground) 12%, transparent);
      overflow: hidden;
      margin: 0 0 12px;
    }

    .start-progress-bar {
      height: 100%;
      width: 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #818cf8, #06b6d4);
      transition: width 0.25s ease;
    }

    .start-illustration {
      display: none;
      width: 50%;
      height: auto;
      margin: 4px auto 8px;
      padding: 4px 0;
    }

    .start-illustration.is-visible {
      display: block;
    }

    .start-credit {
      display: none;
      margin: -4px 0 12px;
      font-size: 10px;
      color: var(--description-foreground);
      opacity: 0.7;
      text-align: center;
    }

    .start-credit.is-visible {
      display: block;
    }

    .start-level-icon {
      display: none;
      text-align: center;
      margin: 0;
      padding: 20px 0 24px;
      line-height: 1;
    }

    .start-level-icon.is-visible {
      display: block;
    }

    .start-level-icon .codicon {
      font-size: 168px;
    }

    .start-section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 10px;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }

    .start-steps {
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .start-steps.is-hidden {
      display: none;
    }

    .start-step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 2px;
      font-size: 12px;
      color: var(--description-foreground);
    }

    .start-step.is-current {
      color: var(--foreground);
      font-weight: 600;
    }

    .start-check {
      width: 16px;
      height: 16px;
      border-radius: 99px;
      border: 1.5px solid var(--description-foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 16px;
      font-size: 10px;
    }

    .start-step.is-done .start-check {
      border-color: var(--status-enabled);
      background: var(--status-enabled);
      color: #fff;
    }

    .start-step-icon {
      font-size: 14px;
      opacity: 0.7;
      flex: 0 0 16px;
    }

    .start-step.is-current .start-step-icon {
      opacity: 1;
    }

    .start-step.is-done .start-step-icon {
      opacity: 0.45;
    }

    .start-how {
      display: none;
      padding: 0;
      border: none;
      background: none;
    }

    .start-how.is-visible {
      display: block;
    }

    .start-how-copy {
      margin: 0 0 16px;
      font-size: 13px;
      color: var(--foreground);
      line-height: 1.55;
    }

    .start-how-copy .start-lead {
      margin: 0 0 12px;
      color: var(--description-foreground);
    }

    .start-how-copy p {
      margin: 0;
      color: var(--description-foreground);
    }

    .start-how-copy ol {
      margin: 0;
      padding-left: 1.15em;
    }

    .start-how-copy li {
      margin: 0 0 10px;
      color: var(--description-foreground);
    }

    .start-how-copy li:last-child {
      margin-bottom: 0;
    }

    .start-how-copy code {
      font-family: var(--vscode-editor-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace);
      font-size: 0.9em;
      padding: 1px 5px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--foreground) 12%, transparent);
      color: var(--foreground);
    }

    .start-sample {
      margin: 10px 0 12px;
      padding: 10px 12px;
      border-radius: 6px;
      background: color-mix(in srgb, var(--foreground) 8%, transparent);
      overflow-x: auto;
      user-select: text;
      -webkit-user-select: text;
    }

    .start-sample code {
      display: block;
      padding: 0;
      background: none;
      font-size: 11px;
      line-height: 1.45;
      white-space: pre;
      color: var(--foreground);
    }

    .start-action,
    .start-next {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px 2px 6px;
      border: 1px solid var(--vscode-textLink-foreground, #3794ff);
      border-radius: 4px;
      color: var(--vscode-textLink-foreground, #3794ff);
      text-decoration: none;
      cursor: pointer;
      vertical-align: middle;
      line-height: 1.3;
      box-sizing: border-box;
    }

    .start-action:hover,
    .start-next:hover {
      background: color-mix(in srgb, var(--vscode-textLink-foreground, #3794ff) 12%, transparent);
      border-color: var(--vscode-textLink-foreground, #3794ff);
    }

    .start-action .codicon,
    .start-next .codicon {
      font-size: 13px;
    }

    .start-next-wrap {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .start-next-prefix {
      color: var(--description-foreground);
    }

    .start-done {
      display: none;
      text-align: center;
      padding: 16px 8px;
    }

    .start-done.is-visible {
      display: block;
    }

    .start-done-title {
      font-weight: 700;
      margin: 0 0 4px;
    }

    .start-done-copy {
      margin: 0;
      color: var(--description-foreground);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <div id="startChecklist">
    <div class="start-progress-track">
      <div id="progressBar" class="start-progress-bar"></div>
    </div>
    <img id="illustration" class="start-illustration" alt="" />
    <p id="illustrationCredit" class="start-credit">Illustrations by Storyset</p>
    <div id="levelIcon" class="start-level-icon" aria-hidden="true">
      <span class="codicon codicon-smiley"></span>
    </div>
    <h1 id="sectionTitle" class="start-section-title">Welcome to Multimeter</h1>
    <ol class="start-steps" id="steps"></ol>
    <div id="how" class="start-how">
      <div id="howCopy" class="start-how-copy"></div>
      <div class="start-next-wrap">
        <a id="howBtn" class="start-next" href="#">
          <span class="codicon codicon-arrow-right" aria-hidden="true"></span>
          <span class="start-next-prefix">Next:</span>
          create first mmt api file
        </a>
      </div>
    </div>
  </div>

  <div id="startDone" class="start-done">
    <p class="start-done-title">You're ready</p>
    <p class="start-done-copy">Reset Get Started from the command palette if you want this again.</p>
  </div>

    <script>
    const vscode = acquireVsCodeApi();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function safeIcon(value) {
      return /^[a-z0-9-]+$/i.test(value || '') ? value : 'play';
    }

    function formatInline(text, icon) {
      let html = escapeHtml(String(text || ''));
      const iconName = safeIcon(icon);
      html = html.replace(/\[([^\]]+)\]\(how\)/g, function (_, label) {
        return '<a href="#" class="start-action">' +
          '<span class="codicon codicon-' + iconName + '" aria-hidden="true"></span>' +
          label +
        '</a>';
      });
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      return html;
    }

    function renderHowCopy(state) {
      const lead = (state && state.lead) || '';
      const paragraphs = (state && state.howParagraphs) || [];
      const intro = !!(state && state.intro);
      const icon = state && state.howIcon;
      let html = '';
      if (lead) {
        html += '<p class="start-lead">' + formatInline(lead, icon) + '</p>';
      }
      if (intro && paragraphs.length) {
        html += '<ol>' + paragraphs.map(function (paragraph) {
          return '<li>' + formatInline(paragraph, icon) + '</li>';
        }).join('') + '</ol>';
      } else if (paragraphs.length) {
        html += '<p>' + formatInline(paragraphs[0], icon) + '</p>';
      }
      const sample = (state && state.howSample) || '';
      if (sample) {
        html += '<pre class="start-sample"><code>' + escapeHtml(sample.trimEnd()) + '</code></pre>';
      }
      if (!intro && paragraphs.length > 1) {
        html += paragraphs.slice(1).map(function (paragraph) {
          return '<p>' + formatInline(paragraph, icon) + '</p>';
        }).join('');
      }
      document.getElementById('howCopy').innerHTML = html;
    }

    function render(state) {
      const complete = !!(state && state.complete);
      const tasks = (state && state.tasks) || [];
      const percent = complete ? 100 : (Number(state && state.progressPercent) || 0);
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('sectionTitle').textContent = complete
          ? 'Done'
          : (state && state.currentLevelTitle) || '';
      document.getElementById('startChecklist').style.display = complete ? 'none' : 'block';
      document.getElementById('startDone').classList.toggle('is-visible', complete);
      document.getElementById('steps').classList.toggle('is-hidden', !(state && state.showSteps));

      const illustration = document.getElementById('illustration');
      const illustrationCredit = document.getElementById('illustrationCredit');
      const levelIcon = document.getElementById('levelIcon');
      const illustrationUri = (state && state.illustrationUri) || '';
      const iconName = /^[a-z0-9-]+$/i.test((state && state.levelIcon) || '')
          ? state.levelIcon
          : '';
      const iconColor = /^#[0-9a-f]{3,8}$/i.test((state && state.levelIconColor) || '')
          ? state.levelIconColor
          : '#facc15';
      if (!complete && illustrationUri) {
        if (illustration.getAttribute('src') !== illustrationUri) {
          illustration.setAttribute('src', illustrationUri);
        }
        illustration.classList.add('is-visible');
        illustrationCredit.classList.add('is-visible');
        levelIcon.classList.remove('is-visible');
        levelIcon.innerHTML = '';
      } else if (!complete && iconName) {
        illustration.removeAttribute('src');
        illustration.classList.remove('is-visible');
        illustrationCredit.classList.remove('is-visible');
        levelIcon.style.color = iconColor;
        levelIcon.innerHTML = '<span class="codicon codicon-' + iconName + '"></span>';
        levelIcon.classList.add('is-visible');
      } else {
        illustration.removeAttribute('src');
        illustration.classList.remove('is-visible');
        illustrationCredit.classList.remove('is-visible');
        levelIcon.style.color = '';
        levelIcon.innerHTML = '';
        levelIcon.classList.remove('is-visible');
      }

      document.getElementById('steps').innerHTML = tasks.map(function (task) {
        const cls = 'start-step' + (task.done ? ' is-done' : '') + (task.current ? ' is-current' : '');
        const check = task.done ? '<span class="codicon codicon-check"></span>' : '';
        const icon = /^[a-z0-9-]+$/i.test(task.icon || '') ? task.icon : 'circle-outline';
        return '<li class="' + cls + '">' +
          '<span class="start-check">' + check + '</span>' +
          '<span class="codicon codicon-' + icon + ' start-step-icon" aria-hidden="true"></span>' +
          '<span>' + escapeHtml(task.title) + '</span>' +
        '</li>';
      }).join('');

      const how = document.getElementById('how');
      const howBtn = document.getElementById('howBtn');
      if (!complete && state && state.currentTaskId) {
        how.classList.add('is-visible');
        renderHowCopy(state);
        howBtn.setAttribute('data-step', state.currentTaskId);
        const label = (state && state.howButton) || '';
        howBtn.innerHTML =
            '<span class="codicon codicon-arrow-right" aria-hidden="true"></span>' +
            '<span class="start-next-prefix">Next:</span> ' +
            escapeHtml(label);
      } else {
        how.classList.remove('is-visible');
      }
    }

    window.addEventListener('message', function (event) {
      if (event.data && event.data.type === 'setState') {
        render(event.data.state);
      }
    });

    document.getElementById('howCopy').addEventListener('click', function (event) {
      const el = event.target.closest ? event.target : event.target.parentElement;
      const action = el && el.closest('a.start-action');
      if (!action) {
        return;
      }
      event.preventDefault();
      const step = document.getElementById('howBtn').getAttribute('data-step');
      if (step) {
        vscode.postMessage({ type: 'showHow', step: step });
      }
    });

    document.getElementById('howBtn').addEventListener('click', function (event) {
      event.preventDefault();
      vscode.postMessage({ type: 'completeLevel' });
    });

    vscode.postMessage({ type: 'ready' });
  </script>
</body>

</html>
